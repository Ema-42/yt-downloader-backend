services:
  - type: web
    name: yt-downloader-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIES_FILE
        value: /etc/secrets/cookies.txt
      - key: MAX_FILE_AGE_HOURS
        value: "1"
